<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="js/theme-init.js"></script>
<link rel="icon" href="assets/logo.svg">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#080b12">
<link rel="stylesheet" href="css/style.css">
<title>Mensagens · Entre Capítulos</title>
</head>
<body>
<header id="topbar" class="topbar"></header>
<div class="app-layout">
  <aside id="sidebar" class="sidebar"></aside>
  <div class="content-wrap">
    <main class="content messages-content">
      <div class="messages-shell" id="messagesShell">
        <section class="conversation-column">
          <div class="messages-column-head">
            <div>
              <span class="eyebrow">CONVERSAS</span>
              <h1>Mensagens</h1>
            </div>
          </div>
          <div id="conversationList" class="conversation-list">
            <div class="loading-state">Carregando conversas...</div>
          </div>
        </section>

        <section class="chat-column" id="chatColumn">
          <div id="chatEmpty" class="chat-empty">
            <div class="chat-empty-icon">✦</div>
            <h2>Suas conversas</h2>
            <p>Abra uma conversa ou visite o perfil de alguém para enviar uma mensagem.</p>
          </div>

          <div id="chatView" class="chat-view hidden">
            <div class="chat-head">
              <button id="chatBack" class="chat-back" type="button" aria-label="Voltar">‹</button>
              <a id="chatUserLink" class="chat-user" href="perfil.html">
                <span id="chatAvatar" class="chat-avatar">?</span>
                <span>
                  <strong id="chatName">Usuário</strong>
                  <small>Ver perfil</small>
                </span>
              </a>
            </div>

            <div id="messageList" class="message-list"></div>

            <div id="recordingBar" class="recording-bar hidden">
              <span class="recording-dot"></span>
              <strong id="recordingTime">Gravando 0:00</strong>
              <button id="cancelRecording" class="btn btn-ghost" type="button">Cancelar</button>
              <button id="stopRecording" class="btn btn-primary" type="button">Enviar áudio</button>
            </div>

            <form id="messageComposer" class="message-composer">
              <input id="imageInput" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden>
              <button id="attachImage" class="composer-icon" type="button" title="Enviar foto" aria-label="Enviar foto">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/><rect x="3" y="3" width="18" height="18" rx="5"/></svg>
              </button>
              <textarea id="messageInput" rows="1" maxlength="4000" placeholder="Escreva uma mensagem..."></textarea>
              <button id="recordAudio" class="composer-icon" type="button" title="Gravar áudio" aria-label="Gravar áudio">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/></svg>
              </button>
              <button id="sendMessage" class="composer-send" type="submit" aria-label="Enviar mensagem">➤</button>
            </form>
          </div>
        </section>
      </div>
    </main>
    <footer id="siteFooter" class="site-footer"></footer>
  </div>
</div>
<nav id="bottomNav" class="bottom-nav"></nav>
<script src="js/app.js"></script>
<script type="module" src="js/messages.js"></script>
</body>
</html>
