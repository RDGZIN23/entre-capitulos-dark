<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <link rel="icon" href="assets/logo.svg">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#080b12">
  <link rel="stylesheet" href="css/style.css">
  <title>Criar conta · Entre Capítulos</title>
</head>

<body data-auth="signup">
  <div class="form-shell">
    <a class="brand" href="index.html" style="justify-content:center;margin-bottom:18px">
      <img src="assets/logo.svg" alt="">
      <b>Entre <span>Capítulos</span></b>
    </a>

    <div class="form-card">
      <span class="eyebrow">Sua biblioteca começa aqui</span>
      <h1>Criar conta</h1>
      <p class="muted">Crie seu perfil para salvar leituras e acompanhar suas histórias.</p>

      <form id="authForm" class="form-grid">
        <div class="field">
          <label>Nome</label>
          <input id="name" autocomplete="name" required>
        </div>

        <div class="field">
          <label>E-mail</label>
          <input id="email" type="email" autocomplete="email" required>
        </div>

        <div class="field">
          <label>Senha</label>
          <input id="password" type="password" autocomplete="new-password" minlength="6" required>
        </div>

        <div id="authMessage" class="small" style="min-height:20px"></div>

        <button id="authSubmit" class="btn btn-primary" type="submit">Criar conta</button>
      </form>

      <div class="muted small" style="text-align:center;margin-top:16px">
        Já tem uma conta?
        <a class="link" href="login.html">Entrar</a>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
