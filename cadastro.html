<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="js/theme-init.js"></script>
<link rel="icon" href="assets/logo.svg"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#080b12">
<link rel="stylesheet" href="css/style.css"><title>Criar conta · Entre Capítulos</title></head><body data-auth="signup"><div class="form-shell"><a class="brand" href="index.html" style="justify-content:center;margin-bottom:18px"><img src="assets/logo.svg"><b>Entre <span>Capítulos</span></b></a><div class="form-card auth-card"><span class="eyebrow">Faça parte da comunidade</span><h1>Criar conta</h1><p class="muted">Crie seu perfil para ler, conversar, publicar e acompanhar histórias.</p><button id="googleAuth" class="btn google-auth-btn" type="button"><span class="google-mark" aria-hidden="true">G</span><span>Criar com Google</span></button><div class="auth-divider"><span>ou crie com e-mail</span></div><form id="authForm" class="form-grid"><div class="field"><label>Nome</label><input id="name" autocomplete="name" maxlength="80" required></div><div class="field"><label>E-mail</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label>Senha</label><input id="password" type="password" autocomplete="new-password" minlength="6" required></div><div id="authMessage" class="small auth-message" style="min-height:20px"></div><button id="authSubmit" class="btn btn-primary" type="submit">Criar conta</button></form><div class="muted small auth-switch">Já tem conta? <a class="link" href="login.html">Entrar</a></div><div class="muted small auth-links"><a href="privacidade.html">Privacidade</a> · <a href="sobre.html">Sobre</a></div></div></div><script src="js/app.js"></script><script type="module" src="js/auth.js"></script></body></html>
