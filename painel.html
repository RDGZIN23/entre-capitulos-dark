<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="js/theme-init.js"></script>
<link rel="icon" href="assets/logo.svg"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#080b12">
<link rel="stylesheet" href="css/style.css"><link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet"><title>Área do autor · Entre Capítulos</title></head>
<body><header id="topbar" class="topbar"></header><div class="app-layout"><aside id="sidebar" class="sidebar"></aside><div class="content-wrap"><main class="content">
<div class="section-head"><div><h1>Área do autor</h1><p>Qualquer conta pode criar e publicar histórias.</p></div><a class="btn" href="configuracoes.html">⚙ Perfil de autor e apoio</a></div>
<div id="panelKpis" class="kpi-grid"></div>
<div class="tabs section"><button class="tab active" data-panel="myBooks">Meus livros</button><button class="tab" data-panel="bookEditor">Novo / editar livro</button><button class="tab" data-panel="chapterEditor">Capítulos</button></div>
<section id="myBooks" class="panel panel-view"><div class="section-head"><div><h2>Meus livros</h2><p>Somente você pode editar seus livros.</p></div><button id="newBook" class="btn btn-primary">+ Novo livro</button></div><div id="authorBookList" class="table-wrap"></div></section>
<section id="bookEditor" class="panel panel-view hidden"><div class="section-head"><div><h2 id="bookEditorTitle">Novo livro</h2><p>Preencha as informações principais.</p></div></div><form id="bookForm" class="form-grid"><input id="bookId" type="hidden"><div class="form-row"><div class="field"><label>Título</label><input id="bookTitle" maxlength="160" required></div><div class="field"><label>Nome do autor</label><input id="bookAuthor" maxlength="100" required></div></div><div class="form-row"><div class="field"><label>Gênero</label><select id="bookGenre"><option>Romance</option><option>Drama</option><option>Fantasia</option><option>Mistério</option><option>Suspense</option><option>Jovem Adulto</option><option>Dark Romance</option><option>Ficção Científica</option><option>Terror</option><option>Aventura</option><option>Poesia</option></select></div><div class="field"><label>Status</label><select id="bookStatus"><option value="rascunho">Rascunho</option><option value="publicado">Publicado</option></select></div></div><div class="field"><label>Sinopse</label><textarea id="bookDescription" maxlength="4000" required></textarea></div><div class="form-row"><div class="field"><label>Tags</label><input id="bookTags" placeholder="romance, escola, enemies to lovers"><div class="help">Até 8 tags, separadas por vírgula.</div></div><div class="field"><label>Capa</label><input id="bookCover" type="file" accept="image/*"></div></div><label class="small"><input id="bookMature" type="checkbox"> Conteúdo destinado a maiores de 18 anos</label><div style="display:flex;gap:9px;flex-wrap:wrap"><button id="saveBook" class="btn btn-primary" type="submit">Salvar livro</button><button id="deleteBook" class="btn btn-danger hidden" type="button">Excluir livro</button></div></form></section>
<section id="chapterEditor" class="panel panel-view hidden"><div class="section-head"><div><h2>Capítulos</h2><p>Selecione um livro, escreva e publique.</p></div></div><div class="field"><label>Livro</label><select id="chapterBook"></select></div><div id="chapterList" class="chapter-list section"></div><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><form id="chapterForm" class="form-grid"><input id="chapterId" type="hidden"><div class="form-row"><div class="field"><label>Número</label><input id="chapterNumber" type="number" min="1" required></div><div class="field"><label>Status</label><select id="chapterStatus"><option value="rascunho">Rascunho</option><option value="publicado">Publicado</option></select></div></div><div class="field"><label>Título</label><input id="chapterTitle" maxlength="180" required></div><div class="field"><label>Resumo curto</label><input id="chapterSummary" maxlength="260"></div><div class="field"><label>Texto</label><div class="quill-shell"><div id="chapterEditorQuill"></div></div></div><div style="display:flex;gap:9px;flex-wrap:wrap"><button id="saveChapter" class="btn btn-primary" type="submit">Salvar capítulo</button><button id="cancelChapter" class="btn hidden" type="button">Cancelar edição</button><button id="deleteChapter" class="btn btn-danger hidden" type="button">Excluir capítulo</button></div></form></section>
</main><footer id="siteFooter" class="site-footer"></footer></div></div><nav id="bottomNav" class="bottom-nav"></nav>
<script src="js/app.js"></script><script type="module" src="js/panel.js"></script><script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script></body></html>
