<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<body><header id="topbar" class="topbar"></header><div class="app-layout"><aside id="sidebar" class="sidebar"></aside>

</section>
<section class="section panel"><div class="section-head"><h2>Meus livros</h2></div><div class="table-wrap"><table class="table"><thead><tr><th>Livro</th><th>Capítulos</th><th>Leituras</th><th>Status</th><th></th></tr></thead><tbody id="bookRows"></tbody></table></div></section>
</main></div></div><nav id="bottomNav" class="bottom-nav"></nav>
