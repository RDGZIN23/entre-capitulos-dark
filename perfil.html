<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <link rel="icon" href="assets/logo.svg">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#080b12">
  <link rel="stylesheet" href="css/style.css">
  <title>Perfil · Entre Capítulos</title>
</head>
<body>
  <header id="topbar" class="topbar"></header>

  <div class="app-layout">
    <aside id="sidebar" class="sidebar"></aside>

    <div class="content-wrap">
      <main class="content">
        <section class="panel">
          <div class="profile-head">
            <div id="avatar" class="avatar-lg">?</div>

            <div>
              <h1 id="name">Carregando...</h1>
              <div id="bio" class="muted"></div>
            </div>

            <div class="profile-action" style="display:flex;gap:8px;flex-wrap:wrap">
              <button id="editBtn" class="btn">Editar perfil</button>
              <button id="logoutBtn" class="btn btn-danger">Sair</button>
            </div>
          </div>

          <div class="profile-stats">
            <div class="profile-stat">
              <strong id="favCount">0</strong>
              <span class="muted small">salvos</span>
            </div>

            <div class="profile-stat">
              <strong id="readCount">0</strong>
              <span class="muted small">leituras</span>
            </div>

            <div class="profile-stat">
              <strong id="following">0</strong>
              <span class="muted small">seguindo</span>
            </div>
          </div>
        </section>

        <section id="editPanel" class="panel section hidden">
          <div class="form-grid">
            <div class="field">
              <label>Nome</label>
              <input id="editName">
            </div>

            <div class="field">
              <label>Biografia</label>
              <textarea id="editBio"></textarea>
            </div>

            <button id="saveProfile" class="btn btn-primary">
              Salvar alterações
            </button>
          </div>
        </section>

        <section class="section">
          <div class="section-head">
            <h2>Minha biblioteca</h2>
          </div>
          <div id="profileBooks" class="book-grid"></div>
        </section>
      </main>
    </div>
  </div>

  <nav id="bottomNav" class="bottom-nav"></nav>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/perfil.js"></script>
</body>
</html>
