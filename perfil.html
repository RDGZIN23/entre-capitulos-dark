<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="js/theme-init.js"></script>
<link rel="icon" href="assets/logo.svg">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#080b12">
<link rel="stylesheet" href="css/style.css">
<title>Perfil · Entre Capítulos</title>
</head>

<body>

<header id="topbar" class="topbar"></header>

<div class="app-layout">
<aside id="sidebar" class="sidebar"></aside>

<div class="content-wrap">
<main class="content">

<section class="panel unified-profile-card">

  <div class="unified-profile-head">

    <div id="avatar" class="avatar-lg">?</div>

    <div class="unified-profile-info">

      <span id="profileEyebrow" class="eyebrow">PERFIL</span>

      <h1 id="name">Carregando...</h1>

      <div id="bio" class="muted unified-profile-bio"></div>

      <div id="profileMeta" class="profile-meta-row"></div>

      <div id="profileSocials" class="profile-social-buttons"></div>

    </div>

  </div>

  <div id="ownProfileActions" class="profile-main-actions hidden">

    <a class="btn" href="painel.html">
      ✦ Área do autor
    </a>

    <a class="btn" href="configuracoes.html">
      ⚙ Configurações
    </a>

    <button id="logout" class="btn btn-danger">
      Sair
    </button>

  </div>

  <div id="visitorProfileActions" class="profile-main-actions hidden">

    <button id="followProfileBtn" class="btn btn-primary">
      + Seguir
    </button>

  </div>

  <div class="profile-stats">

    <div class="profile-stat">
      <strong id="followerCount">0</strong>
      <span class="muted small">seguidores</span>
    </div>

    <div class="profile-stat">
      <strong id="readCount">0</strong>
      <span class="muted small">leituras</span>
    </div>

    <div class="profile-stat">
      <strong id="followCount">0</strong>
      <span class="muted small">seguindo</span>
    </div>

    <div class="profile-stat">
      <strong id="booksCount">0</strong>
      <span class="muted small">livros publicados</span>
    </div>

  </div>

</section>

<section class="section">

  <div class="section-head">

    <div>
      <h2 id="profileSectionTitle">Histórias publicadas</h2>
      <p id="profileSectionSubtitle" class="muted">
        Livros deste autor.
      </p>
    </div>

    <a id="profileSectionLink" class="link" href="biblioteca.html">
      Ver tudo
    </a>

  </div>

  <div id="profileBooks" class="book-grid"></div>

</section>

</main>

<footer id="siteFooter" class="site-footer"></footer>
</div>
</div>

<nav id="bottomNav" class="bottom-nav"></nav>

<script src="js/app.js"></script>
<script type="module" src="js/profile.js"></script>

</body>
</html>
